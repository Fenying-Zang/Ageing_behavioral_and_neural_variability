[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "ageing-behavioral-neural-variability"
version = "0.1.0"
description = " Code for Ageing behavioral and neural variability analysis [https://doi.org/10.1101/2025.08.22.671763 ]"
authors = [
    {name = "Fenying Zang", email = ""}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

